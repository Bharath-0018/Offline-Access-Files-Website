# docker-compose.yml - Production Deployment for OfflineAccess.com
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: offlineaccess:latest
    container_name: offlineaccess-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PUBLIC_DOMAIN=OfflineAccess.com
      - FORCE_HTTPS=true
      - STORAGE_DIR=/data/storage
      - DB_PATH=/data/cloud.db
    volumes:
      # Persistent storage volume ensures data & database survive container restarts
      - offlineaccess_data:/data
    networks:
      - offlineaccess-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  offlineaccess_data:
    name: offlineaccess_persistent_data

networks:
  offlineaccess-net:
    driver: bridge
