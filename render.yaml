# render.yaml - 1-Click Production Blueprint for Render.com
services:
  - type: web
    name: offlineaccess
    env: node
    plan: standard
    buildCommand: ""
    startCommand: "node server.js"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PUBLIC_DOMAIN
        value: OfflineAccess.com
      - key: FORCE_HTTPS
        value: "true"
      - key: STORAGE_DIR
        value: /var/data/storage
      - key: DB_PATH
        value: /var/data/cloud.db
    disk:
      name: offlineaccess-data
      mountPath: /var/data
      sizeGB: 50
