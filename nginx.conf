# nginx.conf - Production Reverse Proxy Configuration for OfflineAccess.com
# Place in /etc/nginx/sites-available/offlineaccess and symlink to /etc/nginx/sites-enabled/

# 1. Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name OfflineAccess.com www.OfflineAccess.com;

    # Let's Encrypt ACME Challenge verification path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name OfflineAccess.com www.OfflineAccess.com;

    # SSL / TLS Certificates (Managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/OfflineAccess.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/OfflineAccess.com/privkey.pem;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Large File Upload Configuration (Supports 1.5 GB - 5 GB+ files)
    client_max_body_size 5000M;
    client_body_timeout 3600s;
    send_timeout 3600s;

    # Disable proxy buffering for streaming large files and HTTP 206 video range playback
    proxy_buffering off;
    proxy_request_buffering off;

    # Forward to Node.js App container or service (running on port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # Long timeouts for multi-gigabyte transfers
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
